server {
    listen 80;
    server_name produtividade.intranet;   # ajuste

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;          # Databricks pode demorar no primeiro acesso
    }
}
